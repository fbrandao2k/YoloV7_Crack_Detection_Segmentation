name: Credential guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credential-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_secrets.py
